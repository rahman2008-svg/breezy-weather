workflows:
  android-apk:
    name: Breezy Weather APK Build

    environment:
      java: 17

    triggering:
      events:
        - push

    scripts:
      - name: Accept Android licenses
        script: |
          yes | sdkmanager --licenses

      - name: Grant Gradle permission
        script: |
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper