workflows:
  breezy-weather:
    name: Breezy Weather APK

    max_build_duration: 120

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Grant execute permission
        script: |
          chmod +x gradlew

      - name: Show Gradle tasks
        script: |
          ./gradlew tasks

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - "**/*.apk"
